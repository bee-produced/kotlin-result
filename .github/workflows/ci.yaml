name: CI

on:
  pull_request:
    branches: [ "master", "v1.1.22" ]
  push:
    branches: [ "master", "v1.1.22" ]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tasks: build

          - os: macos-latest
            tasks: >
              iosX64Test
              macosX64Test
              tvosX64Test
              watchosX64Test

          - os: windows-latest
            tasks: mingwX64Test

    steps:
      - name: Checkout Project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.konan
          key: "${{ runner.os }}-${{ hashFiles('**/.lock') }}"

      - name: Setup JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 8

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Build with Gradle Wrapper
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload JAR artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-result-jar
          path: kotlin-result/build/libs/kotlin-result-jvm-*.jar

  release:
    name: Publish JAR to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: kotlin-result-jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Automated Release - ${{ github.sha }}"
          tag_name: "release-${{ github.sha }}"
          files: kotlin-result-jvm-*.jar

